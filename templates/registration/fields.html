{% if form.non_field_errors %}<div class="auth-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="auth-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="auth-required">必須</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="auth-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="auth-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
