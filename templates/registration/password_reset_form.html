{% extends "registration/base.html" %}
{% block title %}パスワードの再設定 | 薬剤師国家試験対策{% endblock %}
{% block auth_content %}
<h2 id="auth-title">パスワードの再設定</h2>
<p class="auth-description">登録したメールアドレスを入力してください。再設定用のリンクをお送りします。</p><form method="post">{% csrf_token %}{% include "registration/fields.html" %}<button class="auth-submit" type="submit">再設定メールを送信</button></form>
<div class="auth-footer"><a href="{% url 'login' %}">ログインへ戻る</a></div>
{% endblock %}
